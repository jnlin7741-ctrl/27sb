<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纱布群中势力范围 · 纱布传</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--cinn:#d1452b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0d0f;color:#e8e4da;font-family:'Noto Serif SC',serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--cinn);color:#fff}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:14px 32px;background:rgba(10,10,12,.9);border-bottom:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:12px;font-family:'Ma Shan Zheng';font-size:26px;letter-spacing:.1em;color:#efece2}
.brand .seal{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--cinn);
  color:#fff;border-radius:6px;font-size:20px;box-shadow:0 2px 10px rgba(209,69,43,.5)}
.tb-links{display:flex;gap:8px;flex-wrap:wrap}
.tb-links a{padding:7px 16px;font-size:16px;color:#d8d4c8;border:1px solid rgba(255,255,255,.22);border-radius:999px;transition:.3s}
.tb-links a:hover{color:#fff;border-color:#fff;background:rgba(255,255,255,.08)}

.wrap{max-width:920px;margin:0 auto;padding:86px 16px 40px}
.hint{text-align:center;font-size:14px;color:#8f959c;letter-spacing:.12em;margin:4px 0 18px}
.hint b{color:#e8ca7d;font-weight:600}
.hint b.fall{color:var(--cinn)}

.map-frame{position:relative;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#131417;
  box-shadow:0 24px 80px rgba(0,0,0,.7);padding:6px;overflow:hidden}
svg#map{display:block;width:100%;height:auto;touch-action:manipulation}

/* 透明热区 */
.hit{fill:rgba(0,0,0,0);stroke:transparent;stroke-width:1.5;cursor:pointer;transition:fill .25s,stroke .25s}
.hit:hover{fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.65)}
.hit.active{stroke:rgba(255,255,255,.9);stroke-width:2;fill:rgba(255,255,255,.06)}

/* 头像与连线 */
.cl-line{stroke-width:1.6;stroke-dasharray:4 4;opacity:0;transition:opacity .5s .05s;pointer-events:none}
.cl-line.on{opacity:.95}
.av{opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s;pointer-events:none}
.av.on{opacity:1;transform:translateY(0);pointer-events:auto}
.av a{cursor:pointer}
.av-back{fill:#0c0d10;stroke-width:2.4;transition:filter .3s}
.av a:hover .av-back{filter:drop-shadow(0 0 9px rgba(255,255,255,.8)) drop-shadow(0 0 3px rgba(255,255,255,.5))}
.av-name{font-family:'Noto Serif SC',serif;font-size:12.5px;fill:#f2efe6;text-anchor:middle;letter-spacing:1px;
  paint-order:stroke;stroke:rgba(0,0,0,.8);stroke-width:2.4px;font-weight:600}
.av-tag{font-family:'Noto Serif SC',serif;font-size:9px;fill:#ffb9a8;text-anchor:middle;letter-spacing:1px}
.av-tag-box{fill:rgba(176,42,30,.45);stroke:var(--cinn);stroke-width:.8}
.av-virt{cursor:default}
.virt-glyph{font-family:'Ma Shan Zheng';fill:#c9ccd1;text-anchor:middle}

.foot{text-align:center;padding:22px 0 36px;font-size:13px;color:#6f747b;letter-spacing:.2em}

@media (max-width:760px){
  .topbar{padding:10px 14px}.brand{font-size:20px}.brand .seal{width:30px;height:30px;font-size:16px}
  .tb-links a{padding:5px 10px;font-size:13px}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="seal">纱</span>纱布传</a>
  <nav class="tb-links">
    <a href="index.html">首页</a>
    <a href="gallery.html">名绘</a>
    <a href="map.html">舆图</a>
    <a href="gallery.html#fengshen">封神榜</a>
  </nav>
</header>

<div class="wrap">
  <p class="hint">点按<b>各势力板块</b>，本部人物即现身近旁并与板块连线；点<b>头像</b>翻阅其传。<b class="fall">黑色沦陷之地</b>另有其人。</p>

  <div class="map-frame">
  <svg id="map" viewBox="0 0 512 560" role="img" aria-label="纱布群中势力范围">
    <image href="images/map_ref.webp" x="0" y="0" width="512" height="560" preserveAspectRatio="xMidYMid slice"/>
    <g id="gHits"></g>
    <g id="gLines"></g>
    <g id="gAvatars"></g>
  </svg>
  </div>
</div>

<div class="foot">纱布传 · 势力范围一览</div>

<script src="music.js?v=20261020b"></script>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const el=(t,at,parent)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e;};
  const pad3=i=>String(i).padStart(3,'0');
  const poly=pts=>pts.map(p=>p.join(',')).join(' ');

  /* ===== 势力热区（坐标基于原图 512×560） ===== */
  const REG=[
   {k:'dq',n:'电气院',c:'#4d7fae',
    hit:[[70,125],[160,92],[255,100],[320,145],[335,235],[315,330],[255,392],[165,398],[90,355],[52,270],[48,180]],
    a:[200,320],hub:[200,240],cols:4,SP:55,
    m:[['陈璇',4],['曾志强',5],['刘正文',6],['朱宇辰',7],['吕科榕',12],['徐嘉伟',15],['涂宏宸',18],['钟俊文',19],['叶凯斌',20],['董毅',21],['余宣亮',23]]},
   {k:'jd',n:'机电院',c:'#a03a40',
    hit:[[320,150],[380,115],[450,125],[488,180],[490,260],[455,320],[390,338],[330,300],[310,230]],
    a:[385,300],hub:[385,240],cols:3,SP:55,
    m:[['许醇杰',1],['林建辉',9],['杨建勇',10],['刘舒帆',14],['解勇',17],['高宇轩',24],['梁克楠',25]]},
   {k:'nc',n:'南昌',c:'#d2a944',
    hit:[[110,390],[175,368],[245,385],[275,430],[262,480],[200,505],[135,495],[100,450]],
    a:[190,460],hub:[190,435],cols:2,SP:56,
    m:[['温伟斌',3],['黄祚京',27]]},
   {k:'xy',n:'信院',c:'#7d5fa6',
    hit:[[330,340],[390,325],[450,340],[462,395],[440,435],[380,442],[332,412],[322,370]],
    a:[395,410],hub:[395,375],cols:3,SP:48,
    m:[['陈昭康',2],['黄伟明',8],['肖祝捷',16]]},
   {k:'fx',n:'法学院',c:'#97a153',
    hit:[[280,440],[340,428],[390,445],[398,495],[360,530],[300,532],[272,495]],
    a:[330,505],hub:[330,478],cols:2,SP:54,
    m:[['贺书文',13],['应奇都',26]]},
   {k:'tc',n:'土测院',c:'#8f8f88',
    hit:[[390,455],[440,442],[472,470],[470,520],[430,540],[392,522],[382,485]],
    a:[425,508],hub:[425,482],cols:1,
    m:[['代小川',11]]},
   /* —— 沦陷之地 —— */
   {k:'fq_dq',n:'电气院沦陷区',fall:1,c:'#c9433a',
    hit:[[46,172],[96,160],[124,186],[119,224],[80,240],[48,216]],
    a:[85,238],hub:[62,295],cols:1,
    m:[{n:'黄雨洋',i:22}]},
   {k:'fq_jd',n:'机电院沦陷区',fall:1,c:'#c9433a',
    hit:[[424,130],[470,120],[502,144],[500,182],[462,198],[427,180]],
    a:[464,196],hub:[478,242],cols:1,
    m:[{n:'朱镇',fs:1}]},
   {k:'fq_nc',n:'南昌沦陷区',fall:1,c:'#c9433a',
    hit:[[124,484],[176,468],[216,487],[213,526],[175,546],[131,533]],
    a:[196,520],hub:[262,505],cols:1,
    m:[{n:'张钧朝',v:1}]}
  ];

  const gH=document.getElementById('gHits'),gL=document.getElementById('gLines'),gA=document.getElementById('gAvatars');
  let active=null;

  /* 热区 */
  REG.forEach(r=>{
    r._hitEl=el('polygon',{class:'hit',points:poly(r.hit)},gH);
    r._hitEl.addEventListener('click',()=>toggle(r));
  });

  /* 头像群 */
  REG.forEach(r=>{
    const fall=!!r.fall;
    const n=r.m.length,cols=Math.min(r.cols||4,n),rows=Math.ceil(n/cols),SP=r.SP||55;
    const lineEls=[],avEls=[];
    r.m.forEach((m0,idx)=>{
      const mm=Array.isArray(m0)?{n:m0[0],i:m0[1]}:m0;
      const ci=idx%cols,ri=Math.floor(idx/cols);
      const x=r.hub[0]+(ci-(cols-1)/2)*SP, y=r.hub[1]+(ri-(rows-1)/2)*SP;
      lineEls.push(el('line',{class:'cl-line',stroke:r.c,x1:r.a[0],y1:r.a[1],x2:x,y2:y-4},gL));

      const av=el('g',{class:'av'},gA);
      av.style.transitionDelay=(idx*55)+'ms';
      const link= mm.v?null : mm.fs?('story.html?fs='+mm.fs):('story.html?id='+pad3(mm.i));
      const holder= link?el('a',{href:link},av):el('g',{class:'av-virt'},av);
      el('clipPath',{id:'cp-'+r.k+idx},av).appendChild(el('circle',{cx:0,cy:0,r:19}));
      const cg=el('g',{transform:`translate(${x},${y})`},holder);
      el('circle',{class:'av-back',r:22,stroke:fall?r.c:'#e8ca7d'},cg);
      if(mm.v){
        el('text',{class:'virt-glyph',y:6.5,'font-size':'18'},cg).textContent='虚';
      }else{
        el('image',{href: mm.fs?('images/fengshen/fs'+pad3(mm.fs)+'.jpg'):('images/ch'+pad3(mm.i)+'.jpg'),
          x:-19,y:-19,width:38,height:38,'clip-path':`url(#cp-${r.k}${idx})`,preserveAspectRatio:'xMidYMid slice'},cg);
      }
      el('text',{class:'av-name',x:x,y:y+34},av).textContent=mm.n;
      if(mm.v){
        el('rect',{class:'av-tag-box',x:x-24,y:y+38,width:48,height:13,rx:6},av);
        el('text',{class:'av-tag',x:x,y:y+47.5},av).textContent='虚拟人物';
      }
      avEls.push(av);
    });
    r._show=v=>{lineEls.forEach(l=>l.classList.toggle('on',v));avEls.forEach(a=>a.classList.toggle('on',v));
      r._hitEl.classList.toggle('active',v);};
  });

  function toggle(r){
    const v=active!==r;
    if(active)active._show(false);
    active=v?r:null;
    r._show(v);
  }
})();
</script>
</body>
</html>
