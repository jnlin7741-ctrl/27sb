<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纱布群中势力范围 · 纱布传</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--cinn:#d1452b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0d0f;color:#e8e4da;font-family:'Noto Serif SC',serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--cinn);color:#fff}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:14px 32px;background:rgba(10,10,12,.9);border-bottom:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:12px;font-family:'Ma Shan Zheng';font-size:26px;letter-spacing:.1em;color:#efece2}
.brand .seal{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--cinn);
  color:#fff;border-radius:6px;font-size:20px;box-shadow:0 2px 10px rgba(209,69,43,.5)}
.tb-links{display:flex;gap:8px;flex-wrap:wrap}
.tb-links a{padding:7px 16px;font-size:16px;color:#d8d4c8;border:1px solid rgba(255,255,255,.22);border-radius:999px;transition:.3s}
.tb-links a:hover{color:#fff;border-color:#fff;background:rgba(255,255,255,.08)}

.wrap{max-width:1080px;margin:0 auto;padding:86px 16px 40px}
.hint{text-align:center;font-size:14px;color:#8f959c;letter-spacing:.12em;margin:4px 0 18px}
.hint b{color:#e8ca7d;font-weight:600}
.hint b.fall{color:var(--cinn)}

.map-frame{position:relative;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#131417;
  box-shadow:0 24px 80px rgba(0,0,0,.7);padding:6px;overflow:hidden}
svg#map{display:block;width:100%;height:auto;touch-action:manipulation}

/* 矢量板块即热区 */
.rg{cursor:pointer;transition:filter .25s;stroke:rgba(255,255,255,.13);stroke-width:1}
.rg:hover{filter:brightness(1.22)}
.rg.active{stroke:rgba(255,255,255,.85);stroke-width:2;filter:brightness(1.12)}
.blk{cursor:pointer;transition:filter .25s}
.blk:hover{filter:brightness(2)}
.blk.active{stroke:rgba(255,130,110,.85);stroke-width:1.6}
.fall-tag{font-family:'Noto Serif SC',serif;font-size:12.5px;fill:#d6d1c4;text-anchor:middle;letter-spacing:1px;
  paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:2.5px;pointer-events:none}
.rname{font-family:'Noto Serif SC',serif;font-weight:900;fill:#f3efe4;text-anchor:middle;letter-spacing:2px;
  paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3px;pointer-events:none}
.lg-name{font-family:'Noto Serif SC',serif;font-size:9.5px;fill:#d9d4c8;letter-spacing:.5px}
.lg-pct{font-family:'Noto Serif SC',serif;font-size:8px;fill:#a29c8f}
.pq-name{font-family:'Noto Serif SC',serif;font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;letter-spacing:1px;
  paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.pq-pct{font-family:'Noto Serif SC',serif;font-size:9.5px;fill:rgba(255,255,255,.88);text-anchor:middle;letter-spacing:.5px}
.map-title{font-family:'Noto Serif SC',serif;font-weight:900;font-size:27px;fill:#f0ead8;text-anchor:middle;letter-spacing:5px;
  paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:4px}
.map-sub{font-family:'Noto Serif SC',serif;font-size:8px;fill:#8d8a82;text-anchor:middle;letter-spacing:3.2px}

/* 头像与连线 */
.cl-line{stroke-width:1.6;stroke-dasharray:4 4;opacity:0;transition:opacity .5s .05s;pointer-events:none}
.cl-line.on{opacity:.95}
.av{opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s;pointer-events:none}
.av.on{opacity:1;transform:translateY(0);pointer-events:auto}
.av a{cursor:pointer}
.av-back{fill:#0c0d10;stroke-width:2.4;transition:filter .3s}
.av a:hover .av-back{filter:drop-shadow(0 0 9px rgba(255,255,255,.8)) drop-shadow(0 0 3px rgba(255,255,255,.5))}
.av-name{font-family:'Noto Serif SC',serif;font-size:12.5px;fill:#f2efe6;text-anchor:middle;letter-spacing:1px;
  paint-order:stroke;stroke:rgba(0,0,0,.8);stroke-width:2.4px;font-weight:600}
.av-tag{font-family:'Noto Serif SC',serif;font-size:9px;fill:#ffb9a8;text-anchor:middle;letter-spacing:1px}
.av-tag-box{fill:rgba(176,42,30,.45);stroke:var(--cinn);stroke-width:.8}
.av-virt{cursor:default}
.virt-glyph{font-family:'Ma Shan Zheng';fill:#c9ccd1;text-anchor:middle}

.foot{text-align:center;padding:22px 0 36px;font-size:13px;color:#6f747b;letter-spacing:.2em}

@media (max-width:760px){
  .topbar{padding:10px 14px}.brand{font-size:20px}.brand .seal{width:30px;height:30px;font-size:16px}
  .tb-links a{padding:5px 10px;font-size:13px}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="seal">纱</span>纱布传</a>
  <nav class="tb-links">
    <a href="index.html">首页</a>
    <a href="gallery.html">名绘</a>
    <a href="map.html">舆图</a>
    <a href="gallery.html#fengshen">封神榜</a>
  </nav>
</header>

<div class="wrap">
  <p class="hint">点按<b>各势力板块</b>，本部人物即现身近旁并与板块连线；点<b>头像</b>翻阅其传。<b class="fall">黑色沦陷之地</b>另有其人。</p>

  <div class="map-frame">
  <svg id="map" viewBox="0 0 512 512" role="img" aria-label="纱布群中势力范围">
    <defs>
      <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
        <stop offset="0%" stop-color="#3d3931"/>
        <stop offset="60%" stop-color="#2e2b25"/>
        <stop offset="100%" stop-color="#1d1b16"/>
      </radialGradient>
      <radialGradient id="shade" cx="50%" cy="40%" r="78%">
        <stop offset="0%" stop-color="#fff" stop-opacity=".14"/>
        <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".26"/>
      </radialGradient>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
    <g id="gTex" pointer-events="none"></g>
    <g id="gBorder" pointer-events="none"></g>
    <g id="gRegions"></g>
    <g id="gBlk"></g>
    <g id="gDeco" pointer-events="none">
      <!-- 标题 -->
      <text class="map-title" x="243" y="34">纱布群中势力范围</text>
      <text class="map-sub" x="243" y="50">SHABUQUN ZHONG SHILI FANWEI</text>
      <!-- 指北针 -->
      <text x="489" y="58" font-size="11" fill="#d8d3c6" text-anchor="middle" font-family="Noto Serif SC">N</text>
      <circle cx="489" cy="88" r="14" fill="rgba(0,0,0,.25)" stroke="#9a958a" stroke-width="1"/>
      <path d="M489,74 L492,85 L503,88 L492,91 L489,102 L486,91 L475,88 L486,85 Z" fill="#b7b2a6" opacity=".85"/>
      <circle cx="489" cy="88" r="2.4" fill="#6d675c"/>
      <!-- 左侧图例 -->
      <g id="gLegend"></g>
      <!-- 百分比小牌 -->
      <g transform="translate(36,86) rotate(-4)">
        <rect x="-30" y="-21" width="60" height="42" rx="5" fill="#25557a" stroke="rgba(240,235,220,.55)"/>
        <text class="pq-name" y="-3">电气院</text><text class="pq-pct" y="11">41.4%</text>
      </g>
      <g transform="translate(355,86) rotate(3)">
        <rect x="-30" y="-21" width="60" height="42" rx="5" fill="#6a302d" stroke="rgba(240,235,220,.55)"/>
        <text class="pq-name" y="-3">机电院</text><text class="pq-pct" y="11">24.1%</text>
      </g>
      <g transform="translate(88,288) rotate(-3)">
        <rect x="-28" y="-21" width="56" height="42" rx="5" fill="#c1a66b" stroke="rgba(240,235,220,.55)"/>
        <text class="pq-name" y="-3">南昌</text><text class="pq-pct" y="11">13.8%</text>
      </g>
      <g transform="translate(482,308) rotate(2)">
        <rect x="-28" y="-21" width="56" height="42" rx="5" fill="#4e375f" stroke="rgba(240,235,220,.55)"/>
        <text class="pq-name" y="-3">信院</text><text class="pq-pct" y="11">10.3%</text>
      </g>
      <g transform="translate(482,438) rotate(-2)">
        <rect x="-28" y="-21" width="56" height="42" rx="5" fill="#4a4844" stroke="rgba(240,235,220,.55)"/>
        <text class="pq-name" y="-3">土测院</text><text class="pq-pct" y="11">3.4%</text>
      </g>
      <g transform="translate(273,486) rotate(2)">
        <rect x="-28" y="-21" width="56" height="42" rx="5" fill="#23252a" stroke="rgba(240,235,220,.45)"/>
        <text class="pq-name" y="-3">法学院</text><text class="pq-pct" y="11">6.9%</text>
      </g>
      <!-- 板块名 -->
      <text class="rname" x="240" y="132" font-size="20">电气院</text>
      <text class="rname" x="404" y="222" font-size="20">机电院</text>
      <text class="rname" x="186" y="366" font-size="19">南昌</text>
      <text class="rname" x="392" y="320" font-size="18">信院</text>
      <text class="rname" x="322" y="404" font-size="15">法学院</text>
      <text class="rname" x="420" y="417" font-size="11">土测院</text>
      <!-- 左下角罗盘与盾徽 -->
      <g transform="translate(14,479)" opacity=".8">
        <circle r="13" fill="none" stroke="#7d786d" stroke-width="1.2"/>
        <circle r="7" fill="none" stroke="#7d786d" stroke-width=".8"/>
        <path d="M0,-13 L2,-2 L0,13 L-2,-2 Z" fill="#9a958a"/>
      </g>
      <g transform="translate(50,481)">
        <path d="M-12,-17 L12,-17 L12,1 Q12,15 0,19 Q-12,15 -12,1 Z" fill="#5c4d33" stroke="#d6c084" stroke-width="1.2"/>
        <path d="M0,-17 L0,19 M-12,-2 L12,-2" stroke="#d6c084" stroke-width=".8" opacity=".7" fill="none"/>
      </g>
    </g>
    <g id="gLines"></g>
    <g id="gAvatars"></g>
  </svg>
  </div>
</div>

<div class="foot">纱布传 · 势力范围一览</div>

<script src="music.js?v=20261020b"></script>
<script src="map_paths.js?v=20261020g"></script>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const el=(t,at,parent)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e;};
  const pad3=i=>String(i).padStart(3,'0');
  const defs=document.querySelector('#map defs');
  const gR=document.getElementById('gRegions'),gB=document.getElementById('gBlk'),
        gL=document.getElementById('gLines'),gA=document.getElementById('gAvatars'),
        gD=document.getElementById('gDeco');

  const COLORS={blue:'#25557a',red:'#6a302d',gold:'#c1a66b',purple:'#4e375f',olive:'#5c5d3a',grey:'#4c4a47'};

  /* ===== 势力与人物 ===== */
  const REG=[
   {k:'blue',n:'电气院',c:COLORS.blue,hub:[245,218],a:[240,300],cols:4,SP:46,
    m:[['陈璇',4],['曾志强',5],['刘正文',6],['朱宇辰',7],['吕科榕',12],['徐嘉伟',15],['涂宏宸',18],['钟俊文',19],['叶凯斌',20],['董毅',21],['余宣亮',23]]},
   {k:'red',n:'机电院',c:COLORS.red,hub:[412,232],a:[400,290],cols:3,SP:50,
    m:[['许醇杰',1],['林建辉',9],['杨建勇',10],['刘舒帆',14],['解勇',17],['高宇轩',24],['梁克楠',25]]},
   {k:'gold',n:'南昌',c:COLORS.gold,hub:[190,395],a:[190,428],cols:2,SP:51,
    m:[['温伟斌',3],['黄祚京',27]]},
   {k:'purple',n:'信院',c:COLORS.purple,hub:[390,345],a:[390,378],cols:3,SP:44,
    m:[['陈昭康',2],['黄伟明',8],['肖祝捷',16]]},
   {k:'olive',n:'法学院',c:COLORS.olive,hub:[318,430],a:[318,458],cols:2,SP:49,
    m:[['贺书文',13],['应奇都',26]]},
   {k:'grey',n:'土测院',c:COLORS.grey,hub:[410,440],a:[415,463],cols:1,
    m:[['代小川',11]]}
  ];
  /* 沦陷之地 */
  const FALL=[
   {k:'fq0',pi:0,c:'#c9433a',a:[89,180],hub:[86,262],cols:1,m:[{n:'黄雨洋',i:22}]},
   {k:'fq1',pi:1,c:'#c9433a',a:[436,158],hub:[468,215],cols:1,m:[{n:'朱镇',fs:1}]},
   {k:'fq2',pi:2,c:'#c9433a',a:[164,450],hub:[222,450],cols:1,m:[{n:'张钧朝',v:1}]}
  ];

  let active=null;

  /* ===== 岩面纹理噪斑 ===== */
  (function(){
    const gT=document.getElementById('gTex');
    let s=1234567;
    const rnd=()=>((s=Math.imul(s^s>>>15,s|1),s^=s+Math.imul(s^s>>>7,s|61),(s^s>>>14)>>>0)/4294967296);
    for(let i=0;i<30;i++){
      el('ellipse',{cx:rnd()*512,cy:rnd()*512,rx:14+rnd()*36,ry:8+rnd()*22,
        fill:rnd()>.5?'#000':'#fff',opacity:(.025+rnd()*.035).toFixed(3)},gT);
    }
  })();

  /* ===== 白色裂纹 ===== */
  const CRK={
    blue:[[160,130],[250,118],[190,250],[300,232],[238,312],[140,198]],
    red:[[360,162],[440,224],[380,262],[468,190],[420,150]],
    gold:[[130,332],[180,382],[122,402],[230,382],[200,428]],
    purple:[[362,320],[430,332],[400,380],[452,362]],
    olive:[[300,382],[352,420],[312,452],[368,442]],
    grey:[[398,420],[440,462]]
  };
  function mkRng(seed){let s=seed>>>0;return()=>((s=Math.imul(s^s>>>15,s|1),s^=s+Math.imul(s^s>>>7,s|61),(s^s>>>14)>>>0)/4294967296);}
  function cracks(k,parent){
    const rng=mkRng(k.split('').reduce((a,c)=>a+c.charCodeAt(0)*7,99));
    (CRK[k]||[]).forEach(o=>{
      let x=o[0],y=o[1],ang=rng()*6.28;
      const pts=[[x,y]],n=4+Math.floor(rng()*3);
      for(let i=0;i<n;i++){ang+=(rng()-.5)*1.5;x+=Math.cos(ang)*(7+rng()*9);y+=Math.sin(ang)*(7+rng()*9);pts.push([x,y]);}
      el('polyline',{points:pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' '),
        fill:'none',stroke:'rgba(255,255,255,.2)','stroke-width':1.1},parent);
      if(rng()>.4){ // 分枝
        const b=pts[Math.floor(pts.length/2)];let bx=b[0],by=b[1],ba=ang+.9;
        const bp=[[bx,by]];
        for(let i=0;i<2;i++){ba+=(rng()-.5)*1.2;bx+=Math.cos(ba)*(5+rng()*6);by+=Math.sin(ba)*(5+rng()*6);bp.push([bx,by]);}
        el('polyline',{points:bp.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' '),
          fill:'none',stroke:'rgba(255,255,255,.14)','stroke-width':.9},parent);
      }
    });
  }

  /* ===== 行业图标 ===== */
  const ICON={
    blue:['bolt',[[163,124,1],[236,152,.85],[150,262,.9],[296,318,.8],[206,300,.7]]],
    red:['gear',[[346,158,1],[356,242,.9],[468,238,.9]]],
    gold:['pagoda',[[130,338,1],[184,396,.9],[104,392,.8],[232,420,.85]]],
    purple:['wifi',[[350,346,1],[424,312,.85],[444,378,.85]]],
    olive:['scales',[[352,412,1],[312,442,.7]]],
    grey:['pick',[[378,414,1]]]
  };
  function drawIcon(kind,g){
    const st={fill:'none',stroke:'#f0ecdf','stroke-width':1.6,'stroke-linecap':'round'};
    if(kind==='bolt'){
      el('path',{d:'M1,-8 L-4,2 L-1,2 L-2,8 L4,-2 L1,-2 Z',fill:'#f0ecdf',stroke:'rgba(0,0,0,.4)','stroke-width':.6},g);
    }else if(kind==='gear'){
      el('circle',{cx:0,cy:0,r:4.2,...st,'stroke-width':2},g);
      for(let i=0;i<8;i++){const a=i*Math.PI/4;
        el('line',{x1:Math.cos(a)*5.2,y1:Math.sin(a)*5.2,x2:Math.cos(a)*7.4,y2:Math.sin(a)*7.4,...st},g);}
      el('circle',{cx:0,cy:0,r:1.4,fill:'#f0ecdf'},g);
    }else if(kind==='pagoda'){
      el('path',{d:'M0,-10 L4.5,-4.5 L-4.5,-4.5 Z M-3.8,-4.5 L3.8,-4.5 L3.8,2.5 L-3.8,2.5 Z M-6,2.5 L6,2.5 L6,4.8 L-6,4.8 Z',
        fill:'#f0ecdf',stroke:'rgba(0,0,0,.4)','stroke-width':.5},g);
    }else if(kind==='wifi'){
      el('path',{d:'M-6,0 A7.5,7.5 0 0 1 6,0',...st},g);
      el('path',{d:'M-3.2,3 A4,4 0 0 1 3.2,3',...st},g);
      el('circle',{cx:0,cy:6,r:1.3,fill:'#f0ecdf'},g);
    }else if(kind==='scales'){
      el('path',{d:'M0,-7 L0,6 M-6,-4 L6,-4 M-6,-4 L-6,-1 M6,-4 L6,-1 M-2.5,6 L2.5,6',...st,'stroke-width':1.2},g);
      el('path',{d:'M-8.4,-1 A2.6,2.6 0 0 0 -3.6,-1',...st,'stroke-width':1.1},g);
      el('path',{d:'M3.6,-1 A2.6,2.6 0 0 0 8.4,-1',...st,'stroke-width':1.1},g);
    }else if(kind==='pick'){
      el('path',{d:'M-7,2 Q0,-8 7,2',...st,'stroke-width':2},g);
      el('path',{d:'M0,-4.4 L2.5,8',...st,'stroke-width':1.5},g);
    }
  }
  function icons(k,parent){
    const [kind,arr]=ICON[k]||[];
    (arr||[]).forEach(([x,y,s])=>{
      const g=el('g',{transform:`translate(${x},${y}) scale(${s})`,opacity:.8},parent);
      g.style.filter='drop-shadow(0 1px 1px rgba(0,0,0,.65))';
      drawIcon(kind,g);
    });
  }

  /* ===== 图例 ===== */
  (function(){
    const gLg=document.getElementById('gLegend');
    const items=[['电气院','41.4%','#25557a'],['机电院','24.1%','#6a302d'],['南昌','13.8%','#c1a66b'],
                 ['信院','10.3%','#4e375f'],['法学院','6.9%','#5c5d3a'],['土测院','3.4%','#4c4a47']];
    items.forEach((it,i)=>{
      const y=214+i*38;
      el('rect',{x:8,y:y-10,width:11,height:11,fill:it[2],stroke:'rgba(255,255,255,.4)','stroke-width':.8},gLg);
      const t1=el('text',{class:'lg-name',x:24,y},gLg);t1.textContent=it[0];
      const t2=el('text',{class:'lg-pct',x:24,y:y+11},gLg);t2.textContent=it[1];
    });
  })();

  /* ===== 板块层 ===== */
  REG.forEach(r=>{
    const d=TRACE[r.k];
    const p=el('path',{d,class:'rg',fill:r.c},gR);
    p.addEventListener('click',()=>toggle(r));
    el('path',{d,fill:'url(#shade)','pointer-events':'none'},gR);
    const cp=el('clipPath',{id:'clp-'+r.k},defs);
    el('path',{d},cp);
    const cg=el('g',{'clip-path':`url(#clp-${r.k})`,'pointer-events':'none'},gR);
    cracks(r.k,cg);
    icons(r.k,gR);
    r._el=p;
    r._show=v=>{r._lines.forEach(l=>l.classList.toggle('on',v));r._avs.forEach(a=>a.classList.toggle('on',v));
      r._el.classList.toggle('active',v);};
  });

  const centroid=d=>{
    const pts=d.replace(/[MZ]/g,'').split('L').map(s=>s.split(',').map(Number));
    let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1];});
    return [x/pts.length,y/pts.length];
  };

  FALL.forEach(f=>{
    const d=TRACE.blk[f.pi];
    el('path',{d,fill:'#000',opacity:.6,filter:'url(#soft)','pointer-events':'none'},gB);
    const p=el('path',{d,class:'blk',fill:'#0a0a0b',opacity:.94,stroke:'#0a0a0b','stroke-width':3},gB);
    p.addEventListener('click',()=>toggle(f));
    const c=centroid(d);
    const t=el('text',{class:'fall-tag',x:c[0].toFixed(1),y:(c[1]+4.5).toFixed(1),'pointer-events':'none'},gB);
    t.textContent='沦陷 ✕';
    f._el=p;
    f._show=v=>{f._lines.forEach(l=>l.classList.toggle('on',v));f._avs.forEach(a=>a.classList.toggle('on',v));
      f._el.classList.toggle('active',v);};
  });

  /* ===== 边疆金垫：暗金底垫块垫在板块之下（填满板块间空隙，外露边缘即金边） ===== */
  const gBr=document.getElementById('gBorder');
  el('path',{d:TRACE.outline,fill:'none',stroke:'#9c8a5a','stroke-width':12,opacity:.14,'stroke-linejoin':'round'},gBr);
  el('path',{d:TRACE.outline,fill:'#ab935e'},gBr);

  /* ===== 头像群 ===== */
  REG.concat(FALL).forEach(r=>{
    const fall=!!r.pi;
    const n=r.m.length,cols=Math.min(r.cols||4,n),rows=Math.ceil(n/cols),SP=r.SP||55;
    r._lines=[];r._avs=[];
    r.m.forEach((m0,idx)=>{
      const mm=Array.isArray(m0)?{n:m0[0],i:m0[1]}:m0;
      const ci=idx%cols,ri=Math.floor(idx/cols);
      const x=r.hub[0]+(ci-(cols-1)/2)*SP, y=r.hub[1]+(ri-(rows-1)/2)*SP;
      r._lines.push(el('line',{class:'cl-line',stroke:r.c,x1:r.a[0],y1:r.a[1],x2:x,y2:y-4},gL));

      const av=el('g',{class:'av'},gA);
      av.style.transitionDelay=(idx*55)+'ms';
      const link= mm.v?null : mm.fs?('story.html?fs='+mm.fs):('story.html?id='+pad3(mm.i));
      const holder= link?el('a',{href:link},av):el('g',{class:'av-virt'},av);
      el('clipPath',{id:'cp-'+r.k+idx},av).appendChild(el('circle',{cx:0,cy:0,r:19}));
      const cg=el('g',{transform:`translate(${x},${y})`},holder);
      el('circle',{class:'av-back',r:22,stroke:fall?r.c:'#e8ca7d'},cg);
      if(mm.v){
        el('text',{class:'virt-glyph',y:6.5,'font-size':'18'},cg).textContent='虚';
      }else{
        el('image',{href: mm.fs?('images/fengshen/fs'+pad3(mm.fs)+'.jpg'):('images/ch'+pad3(mm.i)+'.jpg'),
          x:-19,y:-19,width:38,height:38,'clip-path':`url(#cp-${r.k}${idx})`,preserveAspectRatio:'xMidYMid slice'},cg);
      }
      el('text',{class:'av-name',x:x,y:y+34},av).textContent=mm.n;
      if(mm.v){
        el('rect',{class:'av-tag-box',x:x-24,y:y+38,width:48,height:13,rx:6},av);
        el('text',{class:'av-tag',x:x,y:y+47.5},av).textContent='虚拟人物';
      }
      r._avs.push(av);
    });
  });

  function toggle(r){
    const v=active!==r;
    if(active)active._show(false);
    active=v?r:null;
    r._show(v);
  }
})();
</script>
</body>
</html>
